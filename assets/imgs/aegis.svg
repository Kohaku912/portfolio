<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="AEGIS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>

  <g stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1">
    <path d="M0 60H640M0 120H640M0 180H640M0 240H640M0 300H640"/>
    <path d="M80 0V360M160 0V360M240 0V360M320 0V360M400 0V360M480 0V360M560 0V360"/>
  </g>

  <text x="48" y="104" font-family="Segoe UI, Meiryo, sans-serif" font-size="40" font-weight="700" fill="#f8fafc">AEGIS</text>
  <rect x="48" y="122" width="150" height="5" rx="2.5" fill="url(#accent)"/>

  <text x="48" y="168" font-family="Segoe UI, Meiryo, sans-serif" font-size="19" fill="#cbd5e1">6 servers / gRPC / deterministic policy engine</text>
  <text x="48" y="200" font-family="Segoe UI, Meiryo, sans-serif" font-size="19" fill="#cbd5e1">533 modules / 657 tests / 56 design docs</text>

  <g font-family="Consolas, Menlo, monospace" font-size="15" fill="#22d3ee">
    <text x="48" y="268">Python</text>
    <text x="180" y="268">Rust</text>
    <text x="312" y="268">Kotlin</text>
    <text x="444" y="268">gRPC</text>
  </g>
</svg>
