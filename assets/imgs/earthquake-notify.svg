  <text x="48" y="168" font-family="Segoe UI, Meiryo, sans-serif" font-size="19" fill="#cbd5e1">Nextcloud app: P2PQuake monitor to Talk broadcast</text>
  <text x="48" y="200" font-family="Segoe UI, Meiryo, sans-serif" font-size="19" fill="#cbd5e1">external API / DOM scraping / cache / occ command</text>

  <g font-family="Consolas, Menlo, monospace" font-size="15" fill="#34d399">
